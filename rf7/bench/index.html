<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rf7 計測ページ</title>
<body>
<h1>rf7 計測ページ</h1>
<p id="version"></p>
<p>このページは Google に問い合わせません。</p>
<p>端末への保存は行いません。処理時間と件数を計測します。</p>
<h2>ファイルの一致</h2>
<pre id="files">確認中</pre>
<button id="start" disabled>計測を始める</button>
<p id="status" role="status"></p>
<textarea id="mainResult" readonly aria-label="計測の結果"></textarea>
<button id="copyMain" disabled>結果をコピー</button>
<h2>余裕の確かめ（任意）</h2>
<button id="x2" disabled>余裕の確かめ（任意）</button>
<p id="x2Status" role="status"></p>
<textarea id="x2Result" readonly aria-label="余裕の確かめの結果"></textarea>
<button id="copyX2" disabled>結果をコピー</button>
<h2>調整の候補の計測</h2>
<button id="levels" disabled>調整の候補の計測（約 2〜3 分）</button>
<p id="levelsStatus" role="status"></p>
<textarea id="levelsResult" readonly aria-label="調整の候補の計測の結果"></textarea>
<button id="copyLevels" disabled>結果をコピー</button>
<p id="copyStatus" role="status"></p>
<script src="bench.js"></script>
<script>
'use strict';
const el = id => document.getElementById(id);
const env = {
  now: () => performance.now(),
  load: RF7Bench.makeLoad((u, i) => fetch(u, i), location.href),
  sha256: async bytes => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)), b => b.toString(16).padStart(2, '0')).join(''),
  utf8: text => new TextEncoder().encode(text),
  ua: navigator.userAgent,
  install: async by => {
    for (const f of RF7Bench.FILES.filter(f => f.type === 'script')) {
      if (!by[f.key].match) throw new Error('script の不一致');
      const script = document.createElement('script');
      script.textContent = by[f.key].text;
      document.head.appendChild(script);
    }
    env.E = self.RFEngine;
    env.A = self.RF7Adapter;
    env.kantoText = by.kanto.text;
  }
};
el('version').textContent = RF7Bench.VERSION;
const paint = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
let busy = false, filesOk = false, mainComplete = false, progressId = 'status';
env.yield = paint;
env.progress = p => {
  el(progressId).textContent = '計測中 ' + p.done + '/' + p.total + '（' + p.name + '、' + p.maxLabels + '、' + p.run + '回目）';
};
function updateButtons() {
  el('start').disabled = busy || !filesOk;
  el('x2').disabled = busy || !mainComplete;
  el('levels').disabled = busy || !mainComplete;
  for (const [button, result] of [['copyMain', 'mainResult'], ['copyX2', 'x2Result'], ['copyLevels', 'levelsResult']]) {
    el(button).disabled = busy || !el(result).value;
  }
}
async function copy(id) {
  try {
    await navigator.clipboard.writeText(el(id).value);
    el('copyStatus').textContent = 'コピーしました';
  } catch (error) {
    el(id).focus();
    el(id).select();
    el(id).setSelectionRange(0, el(id).value.length);
    el('copyStatus').textContent = '結果の文字を全部選択しました。長押しでコピーしてください。';
  }
}
el('copyMain').onclick = () => copy('mainResult');
el('copyX2').onclick = () => copy('x2Result');
el('copyLevels').onclick = () => copy('levelsResult');
el('start').onclick = async () => {
  if (busy) return;
  busy = true;
  mainComplete = false;
  progressId = 'status';
  el('mainResult').value = '';
  el('x2Result').value = '';
  el('levelsResult').value = '';
  el('x2Status').textContent = '';
  el('levelsStatus').textContent = '';
  el('status').textContent = '計測中';
  updateButtons();
  try {
    await paint();
    const result = await RF7Bench.runMain(env);
    el('mainResult').value = JSON.stringify(result);
    el('status').textContent = '完了';
    mainComplete = true;
  } catch (error) {
    el('status').textContent = '計測失敗: ' + error.message;
  } finally {
    busy = false;
    updateButtons();
  }
};
el('x2').onclick = async () => {
  if (busy || !mainComplete) return;
  busy = true;
  el('x2Status').textContent = '計測中';
  updateButtons();
  try {
    await paint();
    el('x2Result').value = JSON.stringify(RF7Bench.runX2(env, env.kantoText));
    el('x2Status').textContent = '完了';
  } catch (error) {
    el('x2Status').textContent = '計測失敗: ' + error.message;
  } finally {
    busy = false;
    updateButtons();
  }
};
el('levels').onclick = async () => {
  if (busy || !mainComplete) return;
  busy = true;
  progressId = 'levelsStatus';
  el('levelsResult').value = '';
  el('levelsStatus').textContent = '計測中';
  updateButtons();
  try {
    await paint();
    el('levelsResult').value = JSON.stringify(await RF7Bench.runLevels(env, env.kantoText));
    el('levelsStatus').textContent = '完了';
  } catch (error) {
    el('levelsStatus').textContent = '計測失敗: ' + error.message;
  } finally {
    busy = false;
    updateButtons();
  }
};
RF7Bench.checkFiles(env).then(result => {
  el('files').textContent = result.files.map(f => [f.path, f.bytes, f.sha256, f.match ? '一致' : '不一致'].join(' ')).join('\n');
  filesOk = result.files.every(f => f.match);
  updateButtons();
}).catch(error => { el('files').textContent = '確認失敗: ' + error.message; });
</script>
</body>
</html>
